name: CI & Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Security, Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Security, secret scan, supply-chain & CVE audit
        run: pnpm security:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build all packages (Protocol, MCP App, Server, MV3 Extension)
        run: pnpm build

      - name: Run automated tests
        run: pnpm test

      - name: Pack Chrome Web Store ZIP
        run: pnpm pack:cws

      - name: Upload Chrome Web Store ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-browser-mcp-extension
          path: |
            release/chrome-browser-mcp-extension.zip
            packages/extension/dist/manifest.json
          retention-days: 30

  publish-cws:
    name: Publish to Chrome Web Store (API v2)
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Download verified extension package
        uses: actions/download-artifact@v4
        with:
          name: chrome-browser-mcp-extension
          path: .

      - name: Upload & publish via Chrome Web Store API v2 (when version bumped & secrets set)
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node scripts/publish-cws.mjs
