name: CI & Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Security, Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Security, secret scan, supply-chain & CVE audit
        run: pnpm security:check

      - name: Biome strict check & lint
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build all packages (Protocol, MCP App, Server, MV3 Extension, Desktop Plugins)
        run: pnpm build

      - name: Run automated tests
        run: pnpm test

      - name: Pack Chrome Web Store ZIP
        run: pnpm pack:cws

      - name: Pack Claude Desktop MCP Bundle (.mcpb)
        run: node scripts/pack-mcpb.mjs

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chrome-browser-mcp-extension
          path: |
            release/chrome-browser-mcp-extension.zip
            release/chrome-browser-mcp.mcpb
            packages/extension/dist/manifest.json
            packages/protocol/dist
            packages/server/dist
          retention-days: 30

  release:
    name: GitHub Release & Packages
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: chrome-browser-mcp-extension
          path: .

      - name: Create or update GitHub Release (extension ZIP + Claude .mcpb)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          MCPB_ASSET="chrome-browser-mcp-${TAG}.mcpb"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$MCPB_ASSET"; then
              cp release/chrome-browser-mcp.mcpb "release/${MCPB_ASSET}"
              gh release download "$TAG" --pattern "SHA256SUMS.txt" --dir release --clobber || true
              grep -v "$MCPB_ASSET" release/SHA256SUMS.txt > release/SHA256SUMS.tmp 2>/dev/null || true
              (cd release && sha256sum "$MCPB_ASSET") >> release/SHA256SUMS.tmp
              mv release/SHA256SUMS.tmp release/SHA256SUMS.txt
              gh release upload "$TAG" \
                "release/${MCPB_ASSET}" \
                "release/SHA256SUMS.txt" \
                --clobber
              echo "[release] Uploaded ${MCPB_ASSET} and updated SHA256SUMS.txt on ${TAG}."
            else
              echo "[release] GitHub Release ${TAG} already exists with all assets — skipping."
            fi
          else
            cp release/chrome-browser-mcp-extension.zip "release/chrome-browser-mcp-extension-${TAG}.zip"
            cp release/chrome-browser-mcp.mcpb "release/${MCPB_ASSET}"
            (cd release && sha256sum \
              "chrome-browser-mcp-extension-${TAG}.zip" \
              "$MCPB_ASSET" \
              > SHA256SUMS.txt)
            gh release create "$TAG" \
              "release/chrome-browser-mcp-extension-${TAG}.zip" \
              "release/${MCPB_ASSET}" \
              "release/SHA256SUMS.txt" \
              --target "$GITHUB_SHA" \
              --title "Chrome Browser MCP ${TAG}" \
              --generate-notes
            echo "[release] Created GitHub Release ${TAG}."
          fi

      - name: Publish npm packages to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/publish-gh-packages.mjs

  publish-cws:
    name: Publish to Chrome Web Store (API v2)
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download verified extension package
        uses: actions/download-artifact@v8
        with:
          name: chrome-browser-mcp-extension
          path: .

      - name: Upload & publish via Chrome Web Store API v2 (when version bumped & secrets set)
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node scripts/publish-cws.mjs
