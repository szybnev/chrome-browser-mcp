name: CI & Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Security, Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Security, secret scan, supply-chain & CVE audit
        run: pnpm security:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build all packages (Protocol, MCP App, Server, MV3 Extension)
        run: pnpm build

      - name: Run automated tests
        run: pnpm test
